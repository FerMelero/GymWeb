name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# El CI solo necesita leer el código
permissions:
  contents: read

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Sintaxis y lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: backend

      - name: Comprobar la sintaxis de todos los .js
        run: find backend/src frontend/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Lint (ESLint)
        run: npm run lint
        working-directory: backend

      # Cuando existan tests de la API, se ejecutarían aquí con una base de datos simulada.
      # No pongas la clave service_role real de Supabase en los secretos del CI.
