version: 2
updates:
  # Dependencias del backend: avisa de actualizaciones y de vulnerabilidades
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Agrupa las actualizaciones menores y de parche en un solo PR para no llenar de ruido
      minor-and-patch:
        update-types: [minor, patch]

  # Mantiene al día las versiones de las Actions del CI
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
