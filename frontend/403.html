<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso denegado · GymWeb</title>
  <meta name="theme-color" content="#0a0c0f">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c6ff34'/%3E%3Cpath d='M10 16h12M8 11v10M24 11v10M5 13v6M27 13v6' stroke='%230a0c0f' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- Rutas absolutas: esta página se sirve desde cualquier URL inexistente -->
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-page">
  <div class="bg-blobs"><span></span><span></span><span></span></div>
  <div class="bg-grid"></div>

  <main class="error-wrap">
    <div class="error-box">
      <a class="brand" data-home href="/"><span class="brand-mark"><i data-icon="dumbbell" data-size="20"></i></span><b class="brand-name">Gym<span>Web</span></b></a>
      <div class="error-code display" aria-hidden="true">403</div>
      <span class="error-ico"><i data-icon="lock" data-size="30"></i></span>
      <div>
        <span class="eyebrow">Error 403</span>
        <h1 class="display">Acceso denegado</h1>
      </div>
      <p class="lead">No tienes permisos para ver esta página. Si crees que es un error, contacta con recepción.</p>
      <div class="error-actions">
        <a class="btn btn-primary" data-home href="/"><i data-icon="user" data-size="18"></i>Ir a mi página</a>
        <button class="btn" data-logout data-auth-only><i data-icon="logout" data-size="18"></i>Cambiar de cuenta</button>
      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
</body>
</html>
